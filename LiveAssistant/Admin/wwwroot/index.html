<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24小时直播助手管理后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", sans-serif; background: #0f1419; color: #e7e9ea; }
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1a1f26; border-radius: 12px; padding: 24px; width: 380px; }
    input, button, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #38444d; background: #0f1419; color: #e7e9ea; }
    button { background: #1d9bf0; border: none; cursor: pointer; font-weight: 600; }
    button.sec { background: #38444d; }
    button.sm { width: auto; padding: 6px 10px; font-size: 12px; margin: 2px; }
    .hidden { display: none; }
    header { padding: 16px 24px; border-bottom: 1px solid #38444d; display: flex; justify-content: space-between; align-items: center; }
    nav { display: flex; gap: 8px; padding: 12px 24px; border-bottom: 1px solid #38444d; flex-wrap: wrap; }
    nav button { width: auto; padding: 8px 14px; background: #38444d; }
    nav button.active { background: #1d9bf0; }
    main { padding: 24px; max-width: 1200px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .stat { background: #1a1f26; padding: 14px; border-radius: 10px; }
    .stat label { color: #8b98a5; font-size: 12px; }
    .stat div { font-size: 16px; margin-top: 4px; word-break: break-all; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 8px; border-bottom: 1px solid #38444d; text-align: left; font-size: 13px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    .row input, .row select { width: auto; min-width: 100px; margin: 4px 0; }
    h2 { margin-bottom: 10px; }
    textarea { min-height: 280px; font-family: monospace; font-size: 12px; }
    .hint { color: #8b98a5; font-size: 12px; margin-bottom: 8px; }
    .tpl-grid { display: grid; gap: 12px; }
    .tpl-item label { display: block; font-size: 12px; color: #8b98a5; margin-bottom: 4px; }
    .tpl-item textarea { min-height: 60px; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
    }
    .status-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-online { background: rgba(0, 186, 124, 0.15); color: #00ba7c; border: 1px solid rgba(0, 186, 124, 0.45); }
    .status-online .dot { background: #00ba7c; box-shadow: 0 0 0 3px rgba(0, 186, 124, 0.25); }
    .status-offline { background: rgba(244, 33, 46, 0.15); color: #f4212e; border: 1px solid rgba(244, 33, 46, 0.45); }
    .status-offline .dot { background: #f4212e; box-shadow: 0 0 0 3px rgba(244, 33, 46, 0.25); }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .title-row h2 { margin-bottom: 0; }
    header .left { display: flex; align-items: center; gap: 12px; }
    .status-checking { background: rgba(139, 152, 165, 0.15); color: #8b98a5; border: 1px solid rgba(139, 152, 165, 0.45); }
    .status-checking .dot { background: #8b98a5; }
    .panel { background: #1a1f26; border: 1px solid #38444d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .panel h3 { font-size: 15px; margin-bottom: 8px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 12px 0; }
    .option-card {
      background: #0f1419; border: 2px solid #38444d; border-radius: 12px; padding: 14px; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .option-card:hover { border-color: #5b6b7a; }
    .option-card.active { border-color: #1d9bf0; background: rgba(29, 155, 240, 0.08); }
    .option-card h4 { margin-bottom: 6px; font-size: 14px; }
    .option-card p { color: #8b98a5; font-size: 12px; line-height: 1.5; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
    .form-field label { display: block; font-size: 12px; color: #8b98a5; margin-bottom: 4px; }
    .form-field input, .form-field select { margin: 0; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .chip {
      background: #38444d; border: none; color: #e7e9ea; border-radius: 999px;
      padding: 6px 12px; font-size: 12px; cursor: pointer; width: auto;
    }
    .chip:hover { background: #4a5a68; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .toolbar input { width: auto; min-width: 160px; margin: 0; }
    .edit-panel {
      position: fixed; right: 24px; bottom: 24px; width: 360px; max-width: calc(100vw - 48px);
      background: #1a1f26; border: 1px solid #38444d; border-radius: 12px; padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45); z-index: 20;
    }
    .edit-panel.hidden { display: none; }
    .edit-panel h3 { margin-bottom: 10px; }
    .edit-actions { display: flex; gap: 8px; margin-top: 12px; }
    .edit-actions button { width: auto; flex: 1; margin: 0; }
    .inline-input { width: 72px; padding: 4px 6px; margin: 0; font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #38444d; }
    .badge.ok { background: rgba(0,186,124,.2); color: #00ba7c; }
    .badge.warn { background: rgba(255,173,31,.15); color: #ffad1f; }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="card">
      <div class="title-row">
        <h2>24小时直播助手</h2>
        <span class="status-badge status-checking" data-runtime-status><span class="dot"></span>检测中</span>
      </div>
      <p class="hint">可直接登录；点歌客户端未运行时进入后显示「没运行」</p>
      <input id="username" placeholder="用户名" value="" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn" type="button" onclick="login()">登录</button>
      <p id="loginError" style="color:#f4212e;margin-top:8px"></p>
    </div>
  </div>

  <div id="appView" class="hidden">
    <header>
      <div class="left">
        <h1>24小时直播助手管理后台</h1>
        <span class="status-badge status-checking" data-runtime-status><span class="dot"></span>检测中</span>
      </div>
      <button class="sec" style="width:auto" onclick="logout()">退出</button>
    </header>
    <nav id="nav"></nav>
    <main id="main"></main>
    <div id="userEditPanel" class="edit-panel hidden"></div>
  </div>

  <script>
    const base = location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/diangexitong';
    let token = localStorage.getItem('adminToken') || '';
    let appOnline = false;
    const tabs = [
      { id: 'dashboard', label: '控制台' },
      { id: 'queue', label: '点歌队列' },
      { id: 'users', label: '用户管理' },
      { id: 'templates', label: '回复模板' },
      { id: 'random', label: '随机歌曲' },
      { id: 'policy', label: '点歌设置' },
      { id: 'gifts', label: '礼物积分' },
      { id: 'levels', label: '等级权限' },
      { id: 'keywords', label: '关键词回复' },
      { id: 'welcome', label: '欢迎消息' },
      { id: 'banvote', label: '禁言投票' },
      { id: 'blacklist', label: '歌曲黑名单' },
      { id: 'cleanup', label: '数据清理' }
    ];
    const tplKeys = [
      { key: 'songRequestSuccess', label: '点歌成功' },
      { key: 'songRequestRejected', label: '点歌失败' },
      { key: 'songRequestQueued', label: '排队提示' },
      { key: 'pointsQuery', label: '查积分回复' },
      { key: 'giftThanks', label: '礼物感谢' },
      { key: 'welcome', label: '欢迎消息' },
      { key: 'banVotePassed', label: '禁言结果' },
      { key: 'songRequestCooldown', label: '冷却提示' },
      { key: 'queueFull', label: '队列已满' }
    ];
    let currentTab = 'dashboard';

    function setRuntimeStatus(online) {
      appOnline = !!online;
      const label = appOnline ? '在线' : '没运行';
      const cls = appOnline ? 'status-online' : 'status-offline';
      document.querySelectorAll('[data-runtime-status]').forEach((el) => {
        el.className = 'status-badge ' + cls;
        el.innerHTML = '<span class="dot"></span>' + label;
      });
    }

    async function refreshRuntimeStatus() {
      try {
        const res = await fetch(base + '/health?_=' + Date.now(), { cache: 'no-store' });
        if (res.status === 200) {
          const data = await res.json().catch(() => null);
          setRuntimeStatus(data && data.ok === true);
          return;
        }
      } catch (_) {}
      setRuntimeStatus(false);
    }

    async function api(method, path, body) {
      const res = await fetch(base + path, {
        method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      if (res.status === 401) { logout(); throw new Error('unauthorized'); }
      if (res.status === 502 || res.status === 503) {
        setRuntimeStatus(false);
        throw new Error('offline');
      }
      return res.json().catch(() => ({}));
    }

    async function login() {
      const err = document.getElementById('loginError');
      err.textContent = '';
      try {
        const res = await fetch(base + '/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        const data = await res.json().catch(() => ({}));
        if (data.ok) {
          token = data.token; localStorage.setItem('adminToken', token);
          document.getElementById('loginView').classList.add('hidden');
          document.getElementById('appView').classList.remove('hidden');
          await refreshRuntimeStatus();
          renderNav(); showTab('dashboard');
          setInterval(() => currentTab === 'dashboard' && renderDashboard(), 3000);
        } else err.textContent = data.message || '登录失败';
      } catch (_) {
        err.textContent = '登录失败，请稍后重试';
      }
    }

    function logout() { token = ''; localStorage.removeItem('adminToken'); location.reload(); }

    function bindLoginKeys() {
      const onEnter = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          login();
        }
      };
      document.getElementById('username').addEventListener('keydown', onEnter);
      document.getElementById('password').addEventListener('keydown', onEnter);
    }
    bindLoginKeys();

    function renderNav() {
      document.getElementById('nav').innerHTML = tabs.map(t =>
        `<button class="${t.id === currentTab ? 'active' : ''}" onclick="showTab('${t.id}')">${t.label}</button>`).join('');
    }

    function showTab(id) { currentTab = id; renderNav(); renderTab(); }

    async function renderTab() {
      if (currentTab !== 'dashboard') {
        await refreshRuntimeStatus();
        if (!appOnline) {
          await renderOfflineHint(tabs.find(t => t.id === currentTab)?.label || '功能');
          return;
        }
      }
      const m = { dashboard: renderDashboard, queue: renderQueue, users: renderUsers, templates: renderTemplates,
        random: renderRandom, gifts: renderGiftRules, policy: renderPolicy, levels: renderLevels,
        keywords: renderKeywords, welcome: renderWelcome, banvote: renderBanVote, blacklist: renderBlacklist, cleanup: renderCleanup };
      try {
        await (m[currentTab] || renderDashboard)();
      } catch (_) {
        await renderOfflineHint(tabs.find(t => t.id === currentTab)?.label || '功能');
      }
    }

    async function renderDashboard() {
      await refreshRuntimeStatus();
      if (!appOnline) {
        document.getElementById('main').innerHTML = `
          <h2>直播状态</h2>
          <div class="grid">
            <div class="stat"><label>24小时直播助手</label><div style="color:#f4212e;font-weight:700">没运行</div></div>
          </div>
          <p class="hint" style="margin-top:16px">客户端未启动或未连上云端。启动 24小时直播助手 后会自动变为在线。</p>`;
        return;
      }
      try {
        const s = await api('GET', '/api/status');
        document.getElementById('main').innerHTML = `
        <h2>直播状态</h2>
        <div class="grid">
          <div class="stat"><label>24小时直播助手</label><div style="color:#00ba7c;font-weight:700">在线</div></div>
          <div class="stat"><label>抖音连接</label><div>${s.douyinOnline ? '在线' : '离线'} ${s.danmakuConnection || ''}</div></div>
          <div class="stat"><label>酷狗</label><div>${s.kugouOnline ? (s.kugouLoginStatus || '在线') : '离线'}${s.kugouLoginPageUrl ? ` <a href="${s.kugouLoginPageUrl}" target="_blank" rel="noopener">扫码登录</a>` : ''}</div></div>
          <div class="stat"><label>主播</label><div>${s.roomOwnerNickname || '-'}</div></div>
          <div class="stat"><label>抖音登录</label><div>${s.douyinLoginNickname || s.adminNickname || '-'}</div></div>
          <div class="stat"><label>当前歌曲</label><div>${s.currentSong}</div></div>
          <div class="stat"><label>播放模式</label><div>${s.playbackMode}</div></div>
          <div class="stat"><label>队列数量</label><div>${s.queueCount}</div></div>
          <div class="stat"><label>运行时间</label><div>${s.uptime}</div></div>
          <div class="stat"><label>当前任务</label><div>${s.currentTask || '空闲'}</div></div>
          <div class="stat"><label>最后错误</label><div>${s.lastError || '无'}</div></div>
        </div>
        <h2 style="margin-top:20px">播放控制</h2>
        <p class="hint">所有操作经 CommandQueue → PlaybackCommandQueue</p>
        <div class="row">
          <button onclick="api('POST','/api/playback/play')">播放</button>
          <button onclick="api('POST','/api/playback/pause')">暂停</button>
          <button onclick="api('POST','/api/playback/resume')">恢复</button>
          <button onclick="api('POST','/api/playback/skip')">下一首</button>
          <button onclick="api('POST','/api/playback/previous')">上一首</button>
          <button onclick="api('POST','/api/playback/random/on')">开启随机播放</button>
          <button onclick="api('POST','/api/playback/random/off')">关闭随机播放</button>
          <button onclick="api('POST','/api/playback/clear-queue')">清空队列</button>
        </div>`;
      } catch (_) {
        setRuntimeStatus(false);
        document.getElementById('main').innerHTML = `
          <h2>直播状态</h2>
          <div class="grid">
            <div class="stat"><label>24小时直播助手</label><div style="color:#f4212e;font-weight:700">没运行</div></div>
          </div>`;
      }
    }

    async function renderOfflineHint(title) {
      await refreshRuntimeStatus();
      document.getElementById('main').innerHTML = `<h2>${title}</h2>
        <p class="hint" style="color:#f4212e">24小时直播助手没运行，无法操作。请先启动客户端。</p>`;
    }

    async function renderQueue() {
      const q = await api('GET', '/api/queue');
      const now = q.nowPlaying ? `<p>正在播放: <b>${q.nowPlaying.nickname}</b> - ${q.nowPlaying.songName} (${q.nowPlaying.artist || ''})</p>` : '<p>无播放</p>';
      const rows = (q.waiting || []).map(i => `<tr>
        <td>${i.index}</td><td>${i.nickname}</td><td>${i.songName}</td><td>${i.artist || ''}</td><td>${i.time}</td>
        <td><button class="sm" onclick="queueAct(${i.id},'pin')">置顶</button>
        <button class="sm" onclick="queueAct(${i.id},'play')">立即播放</button>
        <button class="sm" onclick="queueAct(${i.id},'del')">删除</button></td></tr>`).join('');
      document.getElementById('main').innerHTML = `<h2>点歌队列</h2>${now}
        <table><tr><th>序号</th><th>用户</th><th>歌曲</th><th>歌手</th><th>时间</th><th>操作</th></tr>${rows}</table>
        <div class="row"><button onclick="api('POST','/api/playback/skip')">跳过当前</button></div>`;
    }

    async function queueAct(id, act) {
      if (act === 'del') await api('DELETE', '/api/queue/' + id);
      else if (act === 'pin') await api('POST', '/api/queue/' + id + '/pin');
      else await api('POST', '/api/queue/' + id + '/play');
      renderQueue();
    }

    const giftPresets = [
      { name: '小心心', points: 1 },
      { name: '玫瑰花', points: 10 },
      { name: '大啤酒', points: 2 },
      { name: '棒棒糖', points: 9 },
      { name: '亲吻', points: 99 },
      { name: '抖音', points: 1 },
      { name: '人气票', points: 1 }
    ];
    let policyDraft = null;
    let userSearchTimer = null;

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    let editingUserId = '';

    function closeUserEdit() {
      editingUserId = '';
      const panel = document.getElementById('userEditPanel');
      if (panel) panel.classList.add('hidden');
    }

    function openUserEdit(user) {
      editingUserId = user.userId || '';
      const panel = document.getElementById('userEditPanel');
      panel.classList.remove('hidden');
      panel.innerHTML = `<h3>编辑用户</h3>
        <p class="hint">${esc(user.nickname)} <span style="font-size:11px">${esc(user.userId)}</span></p>
        <div class="form-grid">
          <div class="form-field"><label>积分（直接设置）</label><input id="uePoints" type="number" value="${user.points}"></div>
          <div class="form-field"><label>等级</label><input id="ueLevel" type="number" value="${user.level}"></div>
          <div class="form-field"><label>角色</label>
            <select id="ueRole"><option>normal</option><option>admin</option><option>manager</option><option>blacklist</option></select></div>
          <div class="form-field"><label>状态</label>
            <select id="ueStatus"><option>active</option><option>muted</option><option>banned</option></select></div>
        </div>
        <div class="form-grid" style="margin-top:8px">
          <div class="form-field"><label>或：增减积分（填此项则忽略上方积分框）</label><input id="ueDelta" type="number" placeholder="正数加/负数减"></div>
        </div>
        <div class="edit-actions">
          <button onclick="saveUserEdit()">保存</button>
          <button class="sec" onclick="closeUserEdit()">关闭</button>
        </div>`;
      document.getElementById('ueRole').value = user.role || 'normal';
      document.getElementById('ueStatus').value = user.status || 'active';
    }

    async function saveUserEdit() {
      if (!editingUserId) return;
      const body = {
        level: +document.getElementById('ueLevel').value,
        role: document.getElementById('ueRole').value,
        status: document.getElementById('ueStatus').value
      };
      const delta = document.getElementById('ueDelta').value.trim();
      if (delta !== '' && !Number.isNaN(+delta) && +delta !== 0) {
        body.pointsDelta = +delta;
      } else {
        body.points = +document.getElementById('uePoints').value;
      }
      await api('PUT', '/api/users/' + encodeURIComponent(editingUserId), body);
      editingUserId = '';
      closeUserEdit();
      loadUserTable();
    }

    async function renderUsers() {
      document.getElementById('main').innerHTML = `<h2>用户管理</h2>
        <div class="panel">
          <p class="hint">可搜索昵称或用户ID，手动调整积分和等级。观众发弹幕 <b>查积分</b> 可查询自己的积分。</p>
          <div class="toolbar">
            <input id="userSearch" placeholder="搜索昵称 / 用户ID" oninput="debounceUserSearch()">
            <button class="sm" onclick="renderUsers()">刷新</button>
          </div>
        </div>
        <div id="userTableWrap"><p class="hint">加载中...</p></div>`;
      await loadUserTable();
    }

    function debounceUserSearch() {
      clearTimeout(userSearchTimer);
      userSearchTimer = setTimeout(loadUserTable, 250);
    }

    window._usersCache = {};

    async function loadUserTable() {
      const q = document.getElementById('userSearch')?.value?.trim() || '';
      const path = q ? '/api/users?q=' + encodeURIComponent(q) : '/api/users';
      const users = await api('GET', path);
      const wrap = document.getElementById('userTableWrap');
      if (!wrap) return;
      users.forEach(u => { window._usersCache[u.userId] = u; });
      wrap.innerHTML = `<table>
        <tr><th>昵称</th><th>积分</th><th>等级</th><th>点歌次数</th><th>角色</th><th>状态</th><th>操作</th></tr>
        ${users.map(u => `<tr>
          <td><div>${esc(u.nickname)}</div><div class="hint" style="font-size:11px">${esc(u.userId)}</div></td>
          <td><b>${u.points}</b>${u.songPermissionUnlimited ? ' <span class="badge ok">无限点歌</span>' : (u.songPermissionCredits > 0 ? ` <span class="badge warn">次数${u.songPermissionCredits}</span>` : '')}</td>
          <td>Lv${u.level}</td><td>${u.requestCount || 0}</td>
          <td>${esc(u.role)}</td><td>${esc(u.status)}</td>
          <td>
            <button class="sm" onclick="openUserEditById('${esc(u.userId)}')">编辑</button>
            <button class="sm" onclick="blacklistUser('${esc(u.userId)}')">拉黑</button>
            <button class="sm" onclick="unblacklistUser('${esc(u.userId)}')">解除</button>
          </td></tr>`).join('')}
      </table>`;
    }

    function openUserEditById(userId) {
      const user = window._usersCache[userId];
      if (user) openUserEdit(user);
    }

    async function blacklistUser(id) {
      await api('PUT', '/api/users/' + encodeURIComponent(id), { role: 'blacklist', status: 'banned' });
      loadUserTable();
    }

    async function unblacklistUser(id) {
      await api('PUT', '/api/users/' + encodeURIComponent(id), { role: 'normal', status: 'active' });
      loadUserTable();
    }

    async function renderTemplates() {
      const t = await api('GET', '/api/templates');
      document.getElementById('main').innerHTML = `<h2>回复模板</h2>
        <p class="hint">变量: {name} {song} {queue} {gift} {score} — 保存到数据库，客户端自动同步</p>
        <div class="tpl-grid" id="tplGrid"></div>
        <button onclick="saveTpl()">保存全部</button>`;
      const grid = document.getElementById('tplGrid');
      tplKeys.forEach(({ key, label }) => {
        const div = document.createElement('div');
        div.className = 'tpl-item';
        div.innerHTML = `<label>${label} (${key})</label><textarea id="tpl_${key}">${t[key] || ''}</textarea>`;
        grid.appendChild(div);
      });
    }

    async function saveTpl() {
      const body = {};
      tplKeys.forEach(({ key }) => { body[key] = document.getElementById('tpl_' + key).value; });
      await api('PUT', '/api/templates', body);
      alert('已保存');
    }

    async function renderRandom() {
      const items = await api('GET', '/api/random-pool');
      document.getElementById('main').innerHTML = `<h2>随机播放池</h2>
        <div class="row">
          <input id="rSong" placeholder="歌曲名" style="width:140px">
          <input id="rArtist" placeholder="歌手" style="width:120px">
          <input id="rSid" placeholder="酷狗ID" style="width:100px">
          <button onclick="addRandom()">添加</button>
        </div>
        <table><tr><th>歌曲</th><th>歌手</th><th>酷狗ID</th><th>状态</th><th>操作</th></tr>
        ${items.map(i => `<tr><td>${i.songName}</td><td>${i.artist}</td><td>${i.songId}</td>
        <td>${i.enabled ? '启用' : '禁用'}</td>
        <td><button class="sm" onclick="toggleRandom(${i.id},${!i.enabled})">${i.enabled?'禁用':'启用'}</button>
        <button class="sm" onclick="api('DELETE','/api/random-pool/${i.id}').then(renderRandom)">删除</button></td></tr>`).join('')}
        </table>`;
    }

    async function addRandom() {
      await api('POST', '/api/random-pool', {
        songName: document.getElementById('rSong').value,
        artist: document.getElementById('rArtist').value,
        songId: document.getElementById('rSid').value,
        keyword: document.getElementById('rSong').value,
        enabled: true
      });
      renderRandom();
    }

    async function toggleRandom(id, en) {
      const items = await api('GET', '/api/random-pool');
      const item = items.find(x => x.id === id);
      if (item) { item.enabled = en; await api('PUT', '/api/random-pool/' + id, item); }
      renderRandom();
    }

    async function renderGiftRules() {
      const rules = await api('GET', '/api/gift-rules');
      document.getElementById('main').innerHTML = `<h2>礼物积分</h2>
        <div class="panel">
          <h3>快捷添加常见礼物</h3>
          <p class="hint">点击礼物名快速添加规则；未配置的礼物按「总钻石 × 1」自动算积分。</p>
          <div class="chip-row" id="giftPresetRow"></div>
        </div>
        <div class="panel">
          <h3>自定义礼物</h3>
          <div class="form-grid">
            <div class="form-field"><label>礼物名（必填）</label><input id="gName" placeholder="如：小心心"></div>
            <div class="form-field"><label>礼物ID（可选）</label><input id="gId" placeholder="抖音礼物ID"></div>
            <div class="form-field"><label>每个礼物积分</label><input id="gPts" type="number" value="1"></div>
            <div class="form-field"><label>点歌次数赠送</label><input id="gPerm" type="number" value="0" placeholder="0=不送"></div>
          </div>
          <div class="row">
            <label><input type="checkbox" id="gAllow"> 送礼物时赠送 1 次点歌资格</label>
            <button onclick="addGiftRule()">添加规则</button>
          </div>
        </div>
        <div class="panel">
          <h3>已配置规则</h3>
          <table><tr><th>礼物</th><th>礼物ID</th><th>积分/个</th><th>点歌次数</th><th>状态</th><th>操作</th></tr>
          ${rules.map(r => `<tr>
            <td><b>${esc(r.giftName)}</b></td>
            <td>${esc(r.giftId || '-')}</td>
            <td><input class="inline-input" id="gp_${r.id}" type="number" value="${r.points}"></td>
            <td>${r.songPermissionCount || (r.allowSongRequest ? 1 : 0)}</td>
            <td>${r.enabled ? '<span class="badge ok">启用</span>' : '禁用'}</td>
            <td>
              <button class="sm" onclick="saveGiftPoints(${r.id})">保存积分</button>
              <button class="sm" onclick="api('DELETE','/api/gift-rules/${r.id}').then(renderGiftRules)">删除</button>
            </td></tr>`).join('') || '<tr><td colspan="6" class="hint">暂无规则，使用上方快捷添加</td></tr>'}
          </table>
        </div>`;
      const row = document.getElementById('giftPresetRow');
      giftPresets.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = `${p.name} = ${p.points}分`;
        btn.onclick = () => quickAddGiftPreset(p.name, p.points);
        row.appendChild(btn);
      });
    }

    async function quickAddGiftPreset(name, points) {
      await api('POST', '/api/gift-rules', { giftName: name, giftId: '', points, allowSongRequest: false, enabled: true });
      renderGiftRules();
    }

    async function addGiftRule() {
      const name = document.getElementById('gName').value.trim();
      if (!name) { alert('请填写礼物名'); return; }
      await api('POST', '/api/gift-rules', {
        giftId: document.getElementById('gId').value.trim(),
        giftName: name,
        points: +document.getElementById('gPts').value || 0,
        songPermissionCount: +document.getElementById('gPerm').value || 0,
        allowSongRequest: document.getElementById('gAllow').checked,
        enabled: true
      });
      renderGiftRules();
    }

    async function saveGiftPoints(id) {
      const rules = await api('GET', '/api/gift-rules');
      const rule = rules.find(x => x.id === id);
      if (!rule) return;
      rule.points = +document.getElementById('gp_' + id).value || 0;
      await api('PUT', '/api/gift-rules/' + id, rule);
      alert('已保存');
    }

    function selectPolicyMode(mode) {
      policyDraft = policyDraft || {};
      policyDraft.mode = mode;
      document.querySelectorAll('.option-card').forEach(el => {
        el.classList.toggle('active', el.dataset.mode === mode);
      });
      document.getElementById('policyDetail').style.display = mode === 'Free' ? 'none' : 'block';
      document.getElementById('policyPointsBlock').style.display = mode === 'Points' ? 'block' : 'none';
      document.getElementById('policyGiftBlock').style.display = mode === 'GiftUnlock' ? 'block' : 'none';
    }

    async function renderPolicy() {
      const p = await api('GET', '/api/song-request-policy');
      policyDraft = { ...p };
      document.getElementById('main').innerHTML = `<h2>点歌设置</h2>
        <div class="panel">
          <h3>点歌模式</h3>
          <p class="hint">选择观众如何获得点歌资格。保存后立即生效。</p>
          <div class="card-grid">
            <div class="option-card" data-mode="Free" onclick="selectPolicyMode('Free')">
              <h4>免费点歌</h4><p>所有观众均可免费点歌，仅受冷却时间和队列限制。</p>
            </div>
            <div class="option-card" data-mode="Points" onclick="selectPolicyMode('Points')">
              <h4>积分点歌</h4><p>每次点歌消耗积分，积分通过送礼物获得。</p>
            </div>
            <div class="option-card" data-mode="GiftUnlock" onclick="selectPolicyMode('GiftUnlock')">
              <h4>礼物解锁</h4><p>送礼物累计达到门槛后解锁点歌权限。</p>
            </div>
          </div>
          <div id="policyDetail" style="display:none;margin-top:12px">
            <div id="policyPointsBlock" class="form-grid">
              <div class="form-field"><label>每次点歌消耗积分</label>
                <input id="pCost" type="number" value="${p.pointsCost || 10}"></div>
              <div class="form-field"><label>弹幕切歌消耗积分</label>
                <input id="pSkipCost" type="number" value="${p.skipPointsCost ?? 20}"></div>
            </div>
            <div id="policyGiftBlock" class="form-grid">
              <div class="form-field"><label>解锁所需累计积分</label>
                <input id="pUnlock" type="number" value="${p.giftUnlockMinPoints || 100}"></div>
              <div class="form-field"><label>必须送过的礼物名（可选）</label>
                <input id="pGift" value="${esc(p.requiredGiftName || '')}" placeholder="留空则不限制礼物种类"></div>
            </div>
            <div class="form-grid">
              <div class="form-field"><label>最低等级要求</label>
                <input id="pMinLevel" type="number" value="${p.minLevel || 0}"></div>
            </div>
          </div>
          <div class="row" style="margin-top:14px">
            <button onclick="savePolicy()">保存点歌设置</button>
          </div>
        </div>
        <div class="panel">
          <h3>弹幕指令</h3>
          <p class="hint">点歌流程：<b>点歌 歌名</b> → 多结果时选择歌手（最多展示3位）→ 回复 <b>确定</b> 后才入队。积分模式下会提示所需积分。<br>
            其他指令：<b>查积分</b> / <b>切歌</b> / <b>下一首</b>。回复话术在「回复模板」中修改。</p>
        </div>`;
      selectPolicyMode(p.mode || 'Free');
    }

    async function savePolicy() {
      const mode = policyDraft?.mode || 'Free';
      await api('PUT', '/api/song-request-policy', {
        mode,
        pointsCost: +(document.getElementById('pCost')?.value || 10),
        skipPointsCost: +(document.getElementById('pSkipCost')?.value || 20),
        giftUnlockMinPoints: +(document.getElementById('pUnlock')?.value || 100),
        minLevel: +(document.getElementById('pMinLevel')?.value || 0),
        requiredGiftName: document.getElementById('pGift')?.value || ''
      });
      alert('点歌设置已保存');
    }

    async function renderLevels() {
      const levels = await api('GET', '/api/level-permissions');
      document.getElementById('main').innerHTML = `<h2>等级权限</h2>
        <p class="hint">影响点歌冷却、费用、插队优先级</p>
        <textarea id="lvlJson">${JSON.stringify(levels, null, 2)}</textarea>
        <button onclick="saveLevels()">保存</button>`;
    }

    async function saveLevels() {
      await api('PUT', '/api/level-permissions', JSON.parse(document.getElementById('lvlJson').value));
      alert('已保存');
    }

    async function renderKeywords() {
      const [rules, enabled] = await Promise.all([
        api('GET', '/api/keywords'),
        api('GET', '/api/song-request-policy').then(() => null)
      ]);
      const kwEnabled = (await fetch(base + '/api/sync/config').then(r => r.json()).catch(() => ({}))).config?.keywordReply?.enabled;
      document.getElementById('main').innerHTML = `<h2>关键词回复</h2>
        <div class="row">
          <label>总开关</label>
          <button class="sm" onclick="toggleKw(true)">开启</button>
          <button class="sm" onclick="toggleKw(false)">关闭</button>
          <span class="hint">当前: ${kwEnabled ? '开启' : '关闭'}</span>
        </div>
        <div class="row">
          <input id="kwWord" placeholder="关键词" style="width:120px">
          <input id="kwReply" placeholder="回复内容 (支持 {name}{score})" style="width:300px">
          <button onclick="addKeyword()">添加</button>
        </div>
        <table><tr><th>关键词</th><th>回复</th><th>状态</th><th>操作</th></tr>
        ${rules.map(r => `<tr><td>${r.keyword}</td><td>${r.replyContent || r.templateKey}</td>
        <td>${r.enabled?'开启':'关闭'}</td>
        <td><button class="sm" onclick="toggleKeyword(${r.id},${!r.enabled})">${r.enabled?'关闭':'开启'}</button>
        <button class="sm" onclick="api('DELETE','/api/keywords/${r.id}').then(renderKeywords)">删除</button></td></tr>`).join('')}
        </table>`;
    }

    async function toggleKw(en) {
      await api('PUT', '/api/keyword-reply-enabled', { enabled: en });
      renderKeywords();
    }

    async function addKeyword() {
      await api('POST', '/api/keywords', {
        keyword: document.getElementById('kwWord').value,
        replyContent: document.getElementById('kwReply').value,
        enabled: true
      });
      renderKeywords();
    }

    async function toggleKeyword(id, en) {
      const rules = await api('GET', '/api/keywords');
      const rule = rules.find(x => x.id === id);
      if (rule) { rule.enabled = en; await api('PUT', '/api/keywords/' + id, rule); }
      renderKeywords();
    }

    async function renderWelcome() {
      const w = await api('GET', '/api/welcome');
      document.getElementById('main').innerHTML = `<h2>欢迎消息</h2>
        <label><input type="checkbox" id="wEn" ${w.enabled?'checked':''}> 开启欢迎</label>
        <input id="wTpl" placeholder="模板" value="${w.template || '欢迎{name}来到直播间 ❤️'}">
        <input id="wCd" type="number" placeholder="冷却秒数" value="${w.cooldownSeconds||300}">
        <button onclick="saveWelcome()">保存</button>`;
    }

    async function saveWelcome() {
      await api('PUT', '/api/welcome', {
        enabled: document.getElementById('wEn').checked,
        template: document.getElementById('wTpl').value,
        cooldownSeconds: +document.getElementById('wCd').value
      });
      alert('已保存');
    }

    async function renderBanVote() {
      const b = await api('GET', '/api/ban-vote-settings');
      const sessions = await api('GET', '/api/ban-votes');
      document.getElementById('main').innerHTML = `<h2>禁言投票设置</h2>
        <label><input type="checkbox" id="bEn" ${b.enabled?'checked':''}> 启用</label>
        <input id="bVotes" type="number" placeholder="需要票数" value="${b.requiredVotes||5}">
        <input id="bWindow" type="number" placeholder="投票时间(秒)" value="${b.windowSeconds||60}">
        <input id="bBan" type="number" placeholder="禁言时间(秒)" value="${b.banDurationSeconds||600}">
        <button onclick="saveBanVote()">保存</button>
        <h3 style="margin-top:16px">进行中的投票</h3>
        <table><tr><th>目标</th><th>票数</th><th>需要</th><th>发起人</th></tr>
        ${(sessions||[]).map(s => `<tr><td>${s.targetNickname}</td><td>${s.voteCount}</td><td>${s.requiredVotes}</td><td>${s.initiatorNickname||'-'}</td></tr>`).join('')}
        </table>`;
    }

    async function saveBanVote() {
      await api('PUT', '/api/ban-vote-settings', {
        enabled: document.getElementById('bEn').checked,
        requiredVotes: +document.getElementById('bVotes').value,
        windowSeconds: +document.getElementById('bWindow').value,
        banDurationSeconds: +document.getElementById('bBan').value
      });
      alert('已保存');
    }

    async function renderBlacklist() {
      const items = await api('GET', '/api/blacklist');
      document.getElementById('main').innerHTML = `<h2>歌曲黑名单</h2>
        <input id="blSong" placeholder="歌曲名"><input id="blReason" placeholder="原因">
        <button onclick="api('POST','/api/blacklist',{songName:document.getElementById('blSong').value,reason:document.getElementById('blReason').value}).then(renderBlacklist)">添加</button>
        <table><tr><th>歌曲</th><th>原因</th><th></th></tr>
        ${items.map(i => `<tr><td>${i.songName}</td><td>${i.reason}</td>
        <td><button class="sm" onclick="api('DELETE','/api/blacklist/${i.id}').then(renderBlacklist)">删除</button></td></tr>`).join('')}
        </table>`;
    }

    async function renderCleanup() {
      const c = await api('GET', '/api/cleanup');
      document.getElementById('main').innerHTML = `<h2>数据清理</h2>
        <label><input type="checkbox" id="cEn" ${c.enabled?'checked':''}> 启用定时清理</label>
        <input id="cInterval" type="number" placeholder="间隔(小时)" value="${c.intervalHours||24}">
        <input id="cQueue" type="number" placeholder="队列保留(天)" value="${c.queueRetentionDays||7}">
        <input id="cGift" type="number" placeholder="礼物保留(天)" value="${c.giftRetentionDays||30}">
        <button onclick="saveCleanup()">保存</button>`;
    }

    async function saveCleanup() {
      await api('PUT', '/api/cleanup', {
        enabled: document.getElementById('cEn').checked,
        intervalHours: +document.getElementById('cInterval').value,
        queueRetentionDays: +document.getElementById('cQueue').value,
        giftRetentionDays: +document.getElementById('cGift').value
      });
      alert('已保存');
    }

    if (token) {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');
      renderNav(); showTab('dashboard');
      setInterval(() => currentTab === 'dashboard' && renderDashboard(), 3000);
    }
    refreshRuntimeStatus();
    setInterval(refreshRuntimeStatus, 5000);
  </script>
</body>
</html>
