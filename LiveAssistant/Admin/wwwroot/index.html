<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24小时直播助手管理后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; font-size: 14px; background: #0f1419; color: #e7e9ea; }
    #appView { display: flex; flex-direction: column; min-height: 100vh; }
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1a1f26; border-radius: 12px; padding: 24px; width: 380px; }
    input, button, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #38444d; background: #0f1419; color: #e7e9ea; }
    button { background: #1d9bf0; border: none; cursor: pointer; font-weight: 600; }
    button.sec { background: #38444d; }
    button.sm { width: auto; padding: 6px 10px; font-size: 12px; margin: 2px; }
    .hidden { display: none; }
    header { padding: 16px 24px; border-bottom: 1px solid #38444d; display: flex; justify-content: space-between; align-items: center; }
    nav { display: flex; gap: 8px; padding: 12px 24px; border-bottom: 1px solid #38444d; flex-wrap: wrap; }
    nav button { width: auto; padding: 8px 14px; background: #38444d; }
    nav button.active { background: #1d9bf0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .stat { background: #1a1f26; padding: 14px; border-radius: 10px; }
    .stat label { color: #8b98a5; font-size: 12px; }
    .stat div { font-size: 16px; margin-top: 4px; word-break: break-all; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #38444d; text-align: left; font-size: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    .row input, .row select { width: auto; min-width: 100px; margin: 4px 0; }
    h2 { margin-bottom: 10px; }
    textarea { min-height: 280px; font-family: monospace; font-size: 12px; }
    .hint { color: #8b98a5; font-size: 13px; margin-bottom: 8px; line-height: 1.5; }
    .tpl-grid { display: grid; gap: 12px; }
    .tpl-item label { display: block; font-size: 12px; color: #8b98a5; margin-bottom: 4px; }
    .tpl-item textarea { min-height: 60px; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
    }
    .status-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-online { background: rgba(0, 186, 124, 0.15); color: #00ba7c; border: 1px solid rgba(0, 186, 124, 0.45); }
    .status-online .dot { background: #00ba7c; box-shadow: 0 0 0 3px rgba(0, 186, 124, 0.25); }
    .status-offline { background: rgba(244, 33, 46, 0.15); color: #f4212e; border: 1px solid rgba(244, 33, 46, 0.45); }
    .status-offline .dot { background: #f4212e; box-shadow: 0 0 0 3px rgba(244, 33, 46, 0.25); }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .title-row h2 { margin-bottom: 0; }
    header .left { display: flex; align-items: center; gap: 12px; }
    .status-checking { background: rgba(139, 152, 165, 0.15); color: #8b98a5; border: 1px solid rgba(139, 152, 165, 0.45); }
    .status-checking .dot { background: #8b98a5; }
    .panel { background: #1a1f26; border: 1px solid #38444d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .panel h3 { font-size: 15px; margin-bottom: 8px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 12px 0; }
    .option-card {
      background: #0f1419; border: 2px solid #38444d; border-radius: 12px; padding: 14px; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .option-card:hover { border-color: #5b6b7a; }
    .option-card.active { border-color: #1d9bf0; background: rgba(29, 155, 240, 0.08); }
    .option-card h4 { margin-bottom: 6px; font-size: 14px; }
    .option-card p { color: #8b98a5; font-size: 12px; line-height: 1.5; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
    .form-field label { display: block; font-size: 12px; color: #8b98a5; margin-bottom: 4px; }
    .form-field input, .form-field select { margin: 0; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .chip {
      background: #38444d; border: none; color: #e7e9ea; border-radius: 999px;
      padding: 6px 12px; font-size: 12px; cursor: pointer; width: auto;
    }
    .chip:hover { background: #4a5a68; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .toolbar input { width: auto; min-width: 160px; margin: 0; }
    .edit-panel {
      position: fixed; right: 24px; bottom: 24px; width: 360px; max-width: calc(100vw - 48px);
      background: #1a1f26; border: 1px solid #38444d; border-radius: 12px; padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45); z-index: 20;
    }
    .edit-panel.hidden { display: none; }
    .edit-panel h3 { margin-bottom: 10px; }
    .edit-actions { display: flex; gap: 8px; margin-top: 12px; }
    .edit-actions button { width: auto; flex: 1; margin: 0; }
    .inline-input { width: 72px; padding: 4px 6px; margin: 0; font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #38444d; }
    .badge.ok { background: rgba(0,186,124,.2); color: #00ba7c; }
    .badge.warn { background: rgba(255,173,31,.15); color: #ffad1f; }
    .health-section { margin-bottom: 16px; }
    .health-section h3 { font-size: 14px; color: #8b98a5; margin-bottom: 8px; }
    .dot-green { color: #00ba7c; }
    .dot-red { color: #f4212e; }
    .preview-box {
      background: #0f1419; border: 1px solid #38444d; border-radius: 8px;
      padding: 12px; margin-top: 10px; white-space: pre-wrap; word-break: break-word;
    }
    .user-detail-header { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .user-detail-header .stat { flex: 1; min-width: 140px; }
    .ledger-delta-pos { color: #00ba7c; }
    .ledger-delta-neg { color: #f4212e; }
    main { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 24px; box-sizing: border-box; }
    .header-wrap { border-bottom: 1px solid #38444d; flex-shrink: 0; }
    nav, .subnav { flex-shrink: 0; }
    header { border-bottom: none; }
    .emergency-bar {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      padding: 8px 24px; background: rgba(244, 33, 46, 0.08);
      border-bottom: 1px solid rgba(244, 33, 46, 0.25);
    }
    .emergency-bar label { font-size: 12px; color: #f4212e; font-weight: 700; margin-right: 4px; }
    .emergency-bar button { width: auto; padding: 6px 12px; font-size: 13px; margin: 0; background: #702e2e; }
    .emergency-bar button:hover { background: #8b3a3a; }
    .emergency-bar button.on { background: #f4212e; }
    .subnav { display: flex; gap: 6px; padding: 8px 24px; border-bottom: 1px solid #38444d; flex-wrap: wrap; background: #151a20; }
    .subnav button { width: auto; padding: 6px 12px; font-size: 13px; background: #2a3440; margin: 0; }
    .subnav button.active { background: #1d9bf0; }
    .module-title { font-size: 13px; color: #8b98a5; margin-bottom: 12px; }
    .level-table input[type="number"] { width: 72px; padding: 4px 6px; margin: 0; font-size: 13px; }
    .level-table input[type="checkbox"] { width: auto; margin: 0; }
    .ops-result-ok { color: #00ba7c; }
    .ops-result-warn { color: #ffad1f; }
    .ops-result-err { color: #f4212e; }
    @media (max-width: 900px) {
      main { padding: 16px; }
      nav button, .subnav button { font-size: 12px; padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="card">
      <div class="title-row">
        <h2>24小时直播助手</h2>
        <span class="status-badge status-checking" data-runtime-status><span class="dot"></span>检测中</span>
      </div>
      <p class="hint">可直接登录；点歌客户端未运行时进入后显示「没运行」</p>
      <input id="username" placeholder="用户名" value="" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn" type="button" onclick="login()">登录</button>
      <p id="loginError" style="color:#f4212e;margin-top:8px"></p>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="header-wrap">
      <header>
        <div class="left">
          <h1>24小时直播助手管理后台</h1>
          <span class="status-badge status-checking" data-runtime-status><span class="dot"></span>检测中</span>
        </div>
        <button class="sec" style="width:auto" onclick="logout()">退出</button>
      </header>
      <div class="emergency-bar">
        <label>紧急操作</label>
        <button id="btnPauseInteraction" onclick="emergencyPauseInteraction()">暂停全部互动</button>
        <button onclick="emergencyCloseSongRequest()">关闭点歌</button>
        <button onclick="emergencyKugouRelogin()">酷狗重新登录</button>
      </div>
    </div>
    <nav id="nav"></nav>
    <div id="subnav" class="subnav hidden"></div>
    <main id="main"></main>
    <div id="userEditPanel" class="edit-panel hidden"></div>
  </div>

  <script>
    const base = location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/diangexitong';
    let token = localStorage.getItem('adminToken') || '';
    let appOnline = false;
    const modules = [
      { id: 'dashboard', label: '首页驾驶舱' },
      { id: 'song-mgmt', label: '点歌管理', subs: [
        { id: 'queue', label: '点歌队列' },
        { id: 'policy', label: '点歌设置' },
        { id: 'random', label: '随机歌曲' },
        { id: 'levels', label: '等级权限' },
        { id: 'blacklist', label: '歌曲黑名单' }
      ]},
      { id: 'users', label: '用户中心' },
      { id: 'gifts', label: '礼物中心' },
      { id: 'playback', label: '播放控制' },
      { id: 'reply', label: '回复管理', subs: [
        { id: 'templates', label: '回复模板' },
        { id: 'keywords', label: '关键词回复' },
        { id: 'welcome', label: '欢迎消息' }
      ]},
      { id: 'settings', label: '系统设置', subs: [
        { id: 'banvote', label: '禁言投票' },
        { id: 'cleanup', label: '数据清理' },
        { id: 'opslog', label: '运营日志' }
      ]}
    ];
    const tplKeys = [
      { key: 'songRequestAccepted', label: '点歌成功' },
      { key: 'songRequestRejected', label: '点歌失败' },
      { key: 'songRequestCooldown', label: '冷却提示' },
      { key: 'songRequestConfirm', label: '确认点歌' },
      { key: 'songRequestConfirmPoints', label: '确认点歌(积分)' },
      { key: 'songNotFound', label: '歌曲未找到' },
      { key: 'queueFull', label: '队列已满' },
      { key: 'pointsQuery', label: '查积分回复' },
      { key: 'giftThanks', label: '礼物感谢' },
      { key: 'welcome', label: '欢迎消息' },
      { key: 'skipSongSuccess', label: '切歌成功' },
      { key: 'skipSongInsufficientPoints', label: '切歌积分不足' }
    ];
    let viewingUserId = '';
    let currentModule = 'dashboard';
    let currentSub = '';

    let dashboardTimer = null;
    let emergencyTimer = null;
    let runtimeTimer = null;

    function stopAppTimers() {
      if (dashboardTimer != null) { clearInterval(dashboardTimer); dashboardTimer = null; }
      if (emergencyTimer != null) { clearInterval(emergencyTimer); emergencyTimer = null; }
      if (runtimeTimer != null) { clearInterval(runtimeTimer); runtimeTimer = null; }
    }

    function startRuntimeTimerOnly() {
      if (runtimeTimer != null) return;
      runtimeTimer = setInterval(refreshRuntimeStatus, 5000);
    }
    function startAppTimers() {
      if (dashboardTimer != null && emergencyTimer != null && runtimeTimer != null) return;
      stopAppTimers();
      dashboardTimer = setInterval(() => {
        if (currentModule === 'dashboard') renderDashboard();
      }, 3000);
      emergencyTimer = setInterval(refreshEmergencyState, 8000);
      runtimeTimer = setInterval(refreshRuntimeStatus, 5000);
    }

    // 供审查/测试读取定时器状态（不影响业务）
    window.__adminRefreshTimers = {
      get dashboardTimer() { return dashboardTimer; },
      get emergencyTimer() { return emergencyTimer; },
      get runtimeTimer() { return runtimeTimer; },
      startAppTimers,
      stopAppTimers,
      startRuntimeTimerOnly
    };

    function getModule(id) { return modules.find(m => m.id === id); }
    function resolvePageId() {
      const mod = getModule(currentModule);
      if (mod?.subs?.length) return currentSub || mod.subs[0].id;
      if (currentModule === 'users') return 'users';
      if (currentModule === 'gifts') return 'gifts';
      if (currentModule === 'playback') return 'playback';
      return currentModule;
    }
    function pageLabel(pageId) {
      for (const m of modules) {
        if (m.id === pageId) return m.label;
        const sub = m.subs?.find(s => s.id === pageId);
        if (sub) return sub.label;
      }
      return '功能';
    }

    function setRuntimeStatus(online) {
      appOnline = !!online;
      const label = appOnline ? '在线' : '没运行';
      const cls = appOnline ? 'status-online' : 'status-offline';
      document.querySelectorAll('[data-runtime-status]').forEach((el) => {
        el.className = 'status-badge ' + cls;
        el.innerHTML = '<span class="dot"></span>' + label;
      });
    }

    async function refreshRuntimeStatus() {
      try {
        const res = await fetch(base + '/health?_=' + Date.now(), { cache: 'no-store' });
        if (res.status === 200) {
          const data = await res.json().catch(() => null);
          setRuntimeStatus(data && data.ok === true);
          return;
        }
      } catch (_) {}
      setRuntimeStatus(false);
    }

    async function api(method, path, body) {
      const res = await fetch(base + path, {
        method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      if (res.status === 401) { logout(); throw new Error('unauthorized'); }
      if (res.status === 502 || res.status === 503) {
        setRuntimeStatus(false);
        throw new Error('offline');
      }
      return res.json().catch(() => ({}));
    }

    async function login() {
      const err = document.getElementById('loginError');
      err.textContent = '';
      try {
        const res = await fetch(base + '/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        const data = await res.json().catch(() => ({}));
        if (data.ok) {
          token = data.token; localStorage.setItem('adminToken', token);
          document.getElementById('loginView').classList.add('hidden');
          document.getElementById('appView').classList.remove('hidden');
          await refreshRuntimeStatus();
          renderNav();
          showModule('dashboard');
          refreshEmergencyState();
          startAppTimers();
        } else err.textContent = data.message || '登录失败';
      } catch (_) {
        err.textContent = '登录失败，请稍后重试';
      }
    }

    function logout() {
      stopAppTimers();
      token = '';
      localStorage.removeItem('adminToken');
      location.reload();
    }

    function bindLoginKeys() {
      const onEnter = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          login();
        }
      };
      document.getElementById('username').addEventListener('keydown', onEnter);
      document.getElementById('password').addEventListener('keydown', onEnter);
    }
    bindLoginKeys();

    function renderNav() {
      document.getElementById('nav').innerHTML = modules.map(m =>
        `<button class="${m.id === currentModule ? 'active' : ''}" onclick="showModule('${m.id}')">${m.label}</button>`).join('');
      renderSubNav();
    }

    function renderSubNav() {
      const mod = getModule(currentModule);
      const bar = document.getElementById('subnav');
      if (!mod?.subs?.length) {
        bar.classList.add('hidden');
        bar.innerHTML = '';
        return;
      }
      bar.classList.remove('hidden');
      const activeSub = currentSub || mod.subs[0].id;
      bar.innerHTML = mod.subs.map(s =>
        `<button class="${s.id === activeSub ? 'active' : ''}" onclick="showSub('${s.id}')">${s.label}</button>`).join('');
    }

    function showModule(id) {
      currentModule = id;
      const mod = getModule(id);
      currentSub = mod?.subs?.length ? mod.subs[0].id : '';
      renderNav();
      renderPage();
    }

    function showSub(id) {
      currentSub = id;
      renderSubNav();
      renderPage();
    }

    function renderPage() { renderTab(); }

    async function renderTab() {
      const pageId = resolvePageId();
      if (pageId !== 'dashboard' && pageId !== 'opslog') {
        await refreshRuntimeStatus();
        if (!appOnline) {
          await renderOfflineHint(pageLabel(pageId));
          return;
        }
      }
      const m = {
        dashboard: renderDashboard, queue: renderQueue, users: renderUsers,
        templates: renderTemplates, random: renderRandom, gifts: renderGiftRules,
        policy: renderPolicy, levels: renderLevels, keywords: renderKeywords,
        welcome: renderWelcome, banvote: renderBanVote, blacklist: renderBlacklist,
        cleanup: renderCleanup, playback: renderPlayback, opslog: renderOpsLog
      };
      try {
        await (m[pageId] || renderDashboard)();
      } catch (_) {
        await renderOfflineHint(pageLabel(pageId));
      }
    }

    function fmtTime(sec) {
      sec = Math.max(0, sec || 0);
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return m + ':' + s;
    }

    function kugouStatusLabel(s) {
      if (!s.kugouOnline) return '<span class="dot-red">🔴 离线</span>';
      const st = (s.kugouLoginStatus || '').toLowerCase();
      if (st.includes('未登录') || st.includes('失效')) return '<span class="dot-red">🔴 失效</span>';
      if (s.kugouFullPlaybackAvailable) return '<span class="dot-green">🟢 完整播放可用</span>';
      return '<span class="dot-yellow">🟡 已登录但完整版不可用</span>';
    }

    async function renderDashboard() {
      await refreshRuntimeStatus();
      if (!appOnline) {
        document.getElementById('main').innerHTML = `
          <h2>首页驾驶舱</h2>
          <div class="panel">
            <div class="health-section">
              <h3>服务状态</h3>
              <div class="grid">
                <div class="stat"><label>24小时直播助手</label><div style="color:#f4212e;font-weight:700">没运行</div></div>
              </div>
            </div>
          </div>
          <p class="hint" style="margin-top:16px">客户端未启动或未连上云端。启动 24小时直播助手 后会自动变为在线。</p>`;
        return;
      }
      try {
        const [s, q] = await Promise.all([api('GET', '/api/status'), api('GET', '/api/queue')]);
        const dy = s.douyinOnline ? '<span class="dot-green">🟢 在线</span>' : '<span class="dot-red">🔴 断开</span>';
        const queuePreview = (q.waiting || []).slice(0, 5).map(i =>
          `<tr><td>${i.index}</td><td>${esc(i.nickname)}</td><td>${esc(i.songName)}</td></tr>`).join('')
          || '<tr><td colspan="3" class="hint">队列为空</td></tr>';
        document.getElementById('main').innerHTML = `
        <h2>首页驾驶舱</h2>
        <div class="panel">
          <div class="health-section">
            <h3>服务状态</h3>
            <div class="grid">
              <div class="stat"><label>抖音连接</label><div>${dy} ${esc(s.danmakuConnection || '')}</div></div>
              <div class="stat"><label>酷狗状态</label><div>${kugouStatusLabel(s)} ${esc(s.kugouLoginStatus || '')}${s.kugouFullPlaybackAvailable ? '' : (s.kugouFullPlaybackReason ? ' · ' + esc(s.kugouFullPlaybackReason) : '')}</div></div>
              <div class="stat"><label>点歌开关</label><div>${s.songRequestEnabled ? '<span class="badge ok">开启</span>' : '<span class="badge warn">关闭</span>'}</div></div>
              <div class="stat"><label>运行时长</label><div>${esc(s.uptime || '-')}</div></div>
            </div>
          </div>
          <div class="health-section">
            <h3>当前播放</h3>
            <div class="grid">
              <div class="stat"><label>歌曲</label><div>${esc(s.nowPlayingSong || s.currentSong || '-')}</div></div>
              <div class="stat"><label>歌手</label><div>${esc(s.nowPlayingArtist || '-')}</div></div>
              <div class="stat"><label>状态</label><div>${esc(s.playbackState || '-')}</div></div>
              <div class="stat"><label>进度</label><div>${fmtTime(s.progressSec)} / ${fmtTime(s.durationSec)}</div></div>
            </div>
          </div>
          <div class="health-section">
            <h3>队列</h3>
            <div class="grid">
              <div class="stat"><label>等待歌曲</label><div><b>${s.waitingQueueCount ?? 0}</b></div></div>
            </div>
            <table style="margin-top:8px"><tr><th>序号</th><th>用户</th><th>歌曲</th></tr>${queuePreview}</table>
            <p class="hint">完整队列管理请前往「点歌管理 → 点歌队列」</p>
          </div>
          <div class="health-section">
            <h3>今日统计</h3>
            <div class="grid">
              <div class="stat"><label>播放歌曲</label><div>${s.todaySongsPlayed ?? 0}</div></div>
              <div class="stat"><label>弹幕数量</label><div>${s.todayDanmakuCount ?? 0}</div></div>
              <div class="stat"><label>礼物次数</label><div>${s.todayGiftCount ?? 0}</div></div>
              <div class="stat"><label>点歌次数</label><div>${s.todaySongRequestCount ?? 0}</div></div>
            </div>

    async function saveUserEdit() {
      if (!editingUserId) return;
      const body = {
        level: +document.getElementById('ueLevel').value,
        role: document.getElementById('ueRole').value,
        status: document.getElementById('ueStatus').value
      };
      const delta = document.getElementById('ueDelta').value.trim();
      const changingPoints = (delta !== '' && !Number.isNaN(+delta) && +delta !== 0)
        || +document.getElementById('uePoints').value !== (window._usersCache[editingUserId]?.points ?? 0);
      if (changingPoints) {
        body.operator = document.getElementById('ueOperator').value.trim();
        body.reason = document.getElementById('ueReason').value.trim();
        if (!body.operator || !body.reason) {
          alert('修改积分必须填写修改人和原因');
          return;
        }
      }
      if (delta !== '' && !Number.isNaN(+delta) && +delta !== 0) {
        body.pointsDelta = +delta;
      } else if (changingPoints) {
        body.points = +document.getElementById('uePoints').value;
      }
      const res = await api('PUT', '/api/users/' + encodeURIComponent(editingUserId), body);
      if (res.ok === false) { alert(res.message || '保存失败'); return; }
      editingUserId = '';
      closeUserEdit();
      if (viewingUserId) await showUserDetail(viewingUserId);
      else loadUserTable();
    }

      users.forEach(u => { window._usersCache[u.userId] = u; });
      wrap.innerHTML = `<table>

      const rule = rules.find(x => x.id === id);
      if (!rule) return;
      rule.points = +document.getElementById('gp_' + id).value || 0;
      await api('PUT', '/api/gift-rules/' + id, rule);
      alert('已保存');
    }

    function selectPolicyMode(mode) {
      policyDraft = policyDraft || {};
      policyDraft.mode = mode;
      document.querySelectorAll('.option-card').forEach(el => {
        el.classList.toggle('active', el.dataset.mode === mode);
      });
      document.getElementById('policyDetail').style.display = mode === 'Free' ? 'none' : 'block';
      document.getElementById('policyPointsBlock').style.display = mode === 'Points' ? 'block' : 'none';
      document.getElementById('policyGiftBlock').style.display = mode === 'GiftUnlock' ? 'block' : 'none';
    }

    async function renderPolicy() {
      const p = await api('GET', '/api/song-request-policy');
      policyDraft = { ...p };
      document.getElementById('main').innerHTML = `<h2>点歌设置</h2>
        <div class="panel">
          <h3>点歌总开关</h3>
          <p class="hint">关闭后观众点歌将回复暂停提示，保存后立即生效。</p>
          <div class="row">
            <label><input type="checkbox" id="pEnabled" ${p.requestEnabled !== false ? 'checked' : ''}> 开启点歌</label>
          </div>
          <div class="form-field" style="margin-top:10px">
            <label>关闭时的回复</label>
            <input id="pPausedMsg" value="${esc(p.pausedReplyMessage || '当前暂停点歌，请稍后再试')}">
          </div>
        </div>
        <div class="panel">
          <h3>用户限制</h3>
          <div class="form-grid">
            <div class="form-field"><label>每日最大点歌次数（0=不限）</label>
              <input id="pDailyMax" type="number" value="${p.maxDailyRequestsPerUser || 0}"></div>
            <div class="form-field"><label>点歌冷却时间（秒）</label>
              <input id="pCooldown" type="number" value="${p.cooldownSeconds ?? 30}"></div>
            <div class="form-field"><label>最大排队数量</label>
              <input id="pMaxQueue" type="number" value="${p.maxQueueSize ?? 50}"></div>
          </div>
        </div>
        <div class="panel">
          <h3>点歌模式</h3>
          <p class="hint">选择观众如何获得点歌资格。</p>
          <div class="card-grid">
            <div class="option-card" data-mode="Free" onclick="selectPolicyMode('Free')">
              <h4>免费</h4><p>所有观众均可免费点歌，仅受冷却时间和队列限制。</p>
            </div>
            <div class="option-card" data-mode="Points" onclick="selectPolicyMode('Points')">
              <h4>积分</h4><p>每次点歌消耗积分，积分通过送礼物获得。</p>
            </div>
            <div class="option-card" data-mode="GiftUnlock" onclick="selectPolicyMode('GiftUnlock')">
              <h4>礼物解锁</h4><p>送礼物累计达到门槛后解锁点歌权限。</p>
            </div>
          </div>
          <div id="policyDetail" style="display:none;margin-top:12px">
            <div id="policyPointsBlock" class="form-grid">
              <div class="form-field"><label>每次点歌消耗积分</label>
                <input id="pCost" type="number" value="${p.pointsCost || 10}"></div>
              <div class="form-field"><label>弹幕切歌消耗积分</label>
                <input id="pSkipCost" type="number" value="${p.skipPointsCost ?? 20}"></div>
            </div>
            <div id="policyGiftBlock" class="form-grid">
              <div class="form-field"><label>解锁所需累计积分</label>
                <input id="pUnlock" type="number" value="${p.giftUnlockMinPoints || 100}"></div>
              <div class="form-field"><label>必须送过的礼物名（可选）</label>
                <input id="pGift" value="${esc(p.requiredGiftName || '')}" placeholder="留空则不限制礼物种类"></div>
            </div>
            <div class="form-grid">
              <div class="form-field"><label>最低等级要求</label>
                <input id="pMinLevel" type="number" value="${p.minLevel || 0}"></div>
            </div>
          </div>
          <div class="row" style="margin-top:14px">
            <button onclick="savePolicy()">保存点歌设置</button>
          </div>
        </div>
        <div class="panel">
          <h3>弹幕指令</h3>
          <p class="hint">点歌流程：<b>点歌 歌名</b> → 多结果时选择歌手 → 回复 <b>确定</b> 后才入队。<br>
            其他指令：<b>查积分</b> / <b>切歌</b> / <b>下一首</b>。</p>
        </div>`;
      selectPolicyMode(p.mode || 'Free');
    }

    async function savePolicy() {
      const mode = policyDraft?.mode || 'Free';
      await api('PUT', '/api/song-request-policy', {
        requestEnabled: document.getElementById('pEnabled').checked,
        pausedReplyMessage: document.getElementById('pPausedMsg').value || '当前暂停点歌，请稍后再试',
        maxDailyRequestsPerUser: +(document.getElementById('pDailyMax').value || 0),
        cooldownSeconds: +(document.getElementById('pCooldown').value || 30),
        maxQueueSize: +(document.getElementById('pMaxQueue').value || 50),
        mode,
        pointsCost: +(document.getElementById('pCost')?.value || 10),
        skipPointsCost: +(document.getElementById('pSkipCost')?.value || 20),
        giftUnlockMinPoints: +(document.getElementById('pUnlock')?.value || 100),
        minLevel: +(document.getElementById('pMinLevel')?.value || 0),
        requiredGiftName: document.getElementById('pGift')?.value || ''
      });
      alert('点歌设置已保存');
    }

    async function renderLevels() {
      const levels = await api('GET', '/api/level-permissions');
      window._levelDraft = levels.map(l => ({ ...l }));
      const rows = window._levelDraft.map((l, i) => `<tr>
        <td><input class="inline-input" type="number" min="0" value="${l.level}" onchange="updateLevelField(${i},'level',+this.value)"></td>
        <td><input class="inline-input" type="number" min="0" value="${l.minPoints ?? 0}" onchange="updateLevelField(${i},'minPoints',+this.value)"></td>
        <td><select class="inline-input" style="width:96px" onchange="updateLevelField(${i},'canRequest',this.value==='1')">
          <option value="1" ${l.canRequest !== false ? 'selected' : ''}>允许点歌</option>
          <option value="0" ${l.canRequest === false ? 'selected' : ''}>禁止点歌</option>
        </select></td>
        <td><input class="inline-input" type="number" min="0" value="${l.cooldownSeconds ?? 0}" onchange="updateLevelField(${i},'cooldownSeconds',+this.value)"> 秒</td>
        <td><input type="checkbox" ${(l.queuePriority ?? 0) > 0 ? 'checked' : ''} onchange="toggleQueuePriority(${i},this.checked)"> 允许插队</td>
        <td><button class="sm sec" onclick="removeLevelRow(${i})">删除</button></td>
      </tr>`).join('');
      document.getElementById('main').innerHTML = `<h2>等级权限</h2>
        <p class="hint">表格化配置各等级：积分要求、点歌限制、冷却时间、插队优先级（数值越大越优先）</p>
        <div class="panel">
          <table class="level-table">
            <tr><th>等级</th><th>积分要求</th><th>点歌限制</th><th>冷却时间</th><th>插队权限</th><th></th></tr>
            ${rows || '<tr><td colspan="6" class="hint">暂无等级，请添加</td></tr>'}
          </table>
          <div class="row" style="margin-top:12px">
            <button class="sm sec" onclick="addLevelRow()">添加等级</button>
            <button onclick="saveLevels()">保存全部</button>
          </div>
        </div>`;
    }

    function updateLevelField(index, field, value) {
      if (!window._levelDraft?.[index]) return;
      window._levelDraft[index][field] = value;
    }

    function toggleQueuePriority(index, enabled) {
      if (!window._levelDraft?.[index]) return;
      const cur = window._levelDraft[index].queuePriority ?? 0;
      window._levelDraft[index].queuePriority = enabled ? (cur > 0 ? cur : 10) : 0;
    }

    function addLevelRow() {
      window._levelDraft = window._levelDraft || [];
      const nextLevel = window._levelDraft.length ? Math.max(...window._levelDraft.map(l => l.level)) + 1 : 0;
      window._levelDraft.push({ level: nextLevel, minPoints: 0, canRequest: true, cooldownSeconds: 30, queuePriority: 0, pointsCostOverride: -1 });
      renderLevels();
    }

    function removeLevelRow(index) {
      window._levelDraft.splice(index, 1);
      renderLevels();
    }

    async function saveLevels() {
      const body = (window._levelDraft || []).map(l => ({
        level: +l.level,
        minPoints: +l.minPoints || 0,
        canRequest: l.canRequest !== false,
        cooldownSeconds: +l.cooldownSeconds || 0,
        queuePriority: +l.queuePriority || 0,
        pointsCostOverride: l.pointsCostOverride ?? -1
      }));
      await api('PUT', '/api/level-permissions', body);
      alert('已保存');
    }

    async function renderOpsLog() {
      const entries = await api('GET', '/api/ops-log?limit=100');
      const rows = (entries || []).map(e => {
        const cls = e.Level === 'ERROR' ? 'ops-result-err' : (e.Level === 'WARN' ? 'ops-result-warn' : 'ops-result-ok');
        return `<tr>
          <td>${esc(e.Time)}</td>
          <td>${esc(e.Event)}</td>
          <td class="${cls}">${esc(e.Result)}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="3" class="hint">暂无日志</td></tr>';
      document.getElementById('main').innerHTML = `<h2>运营日志</h2>
        <p class="hint">面向运营人员，展示后台操作与关键业务事件。无需懂代码即可查看异常。</p>
        <div class="panel">
          <div class="toolbar">
            <button class="sm" onclick="renderOpsLog()">刷新</button>
          </div>
          <table><tr><th>时间</th><th>事件</th><th>结果</th></tr>${rows}</table>
        </div>`;
    }

    async function renderKeywords() {
      const [rules, syncConfig] = await Promise.all([
        api('GET', '/api/keywords'),
        api('GET', '/api/sync/config').catch(() => ({}))
      ]);
      const kwEnabled = syncConfig?.config?.keywordReply?.enabled;
      document.getElementById('main').innerHTML = `<h2>关键词回复</h2>
        <div class="row">
          <label>总开关</label>
          <button class="sm" onclick="toggleKw(true)">开启</button>
          <button class="sm" onclick="toggleKw(false)">关闭</button>
          <span class="hint">当前: ${kwEnabled ? '开启' : '关闭'}</span>
        </div>
        <div class="row">
          <input id="kwWord" placeholder="关键词" style="width:120px">
          <input id="kwReply" placeholder="回复内容 (支持 {name}{score})" style="width:300px">
          <button onclick="addKeyword()">添加</button>
        </div>
        <table><tr><th>关键词</th><th>回复</th><th>状态</th><th>操作</th></tr>
        ${rules.map(r => `<tr><td>${r.keyword}</td><td>${r.replyContent || r.templateKey}</td>
        <td>${r.enabled?'开启':'关闭'}</td>
        <td><button class="sm" onclick="toggleKeyword(${r.id},${!r.enabled})">${r.enabled?'关闭':'开启'}</button>
        <button class="sm" onclick="api('DELETE','/api/keywords/${r.id}').then(renderKeywords)">删除</button></td></tr>`).join('')}
        </table>`;
    }

    async function toggleKw(en) {
      await api('PUT', '/api/keyword-reply-enabled', { enabled: en });
      renderKeywords();
    }

    async function addKeyword() {
      await api('POST', '/api/keywords', {
        keyword: document.getElementById('kwWord').value,
        replyContent: document.getElementById('kwReply').value,
        enabled: true
      });
      renderKeywords();
    }

    async function toggleKeyword(id, en) {
      const rules = await api('GET', '/api/keywords');
      const rule = rules.find(x => x.id === id);
      if (rule) { rule.enabled = en; await api('PUT', '/api/keywords/' + id, rule); }
      renderKeywords();
    }

    async function renderWelcome() {
      const w = await api('GET', '/api/welcome');
      document.getElementById('main').innerHTML = `<h2>欢迎消息</h2>
        <label><input type="checkbox" id="wEn" ${w.enabled?'checked':''}> 开启欢迎</label>
        <input id="wTpl" placeholder="模板" value="${w.template || '欢迎{name}来到直播间 ❤️'}">
        <input id="wCd" type="number" placeholder="冷却秒数" value="${w.cooldownSeconds||300}">
        <button onclick="saveWelcome()">保存</button>`;
    }

    async function saveWelcome() {
      await api('PUT', '/api/welcome', {
        enabled: document.getElementById('wEn').checked,
        template: document.getElementById('wTpl').value,
        cooldownSeconds: +document.getElementById('wCd').value
      });
      alert('已保存');
    }

    async function renderBanVote() {
      const b = await api('GET', '/api/ban-vote-settings');
      const sessions = await api('GET', '/api/ban-votes');
      document.getElementById('main').innerHTML = `<h2>禁言投票设置</h2>
        <label><input type="checkbox" id="bEn" ${b.enabled?'checked':''}> 启用</label>
        <input id="bVotes" type="number" placeholder="需要票数" value="${b.requiredVotes||5}">
        <input id="bWindow" type="number" placeholder="投票时间(秒)" value="${b.windowSeconds||60}">
        <input id="bBan" type="number" placeholder="禁言时间(秒)" value="${b.banDurationSeconds||600}">
        <button onclick="saveBanVote()">保存</button>
        <h3 style="margin-top:16px">进行中的投票</h3>
        <table><tr><th>目标</th><th>票数</th><th>需要</th><th>发起人</th></tr>
        ${(sessions||[]).map(s => `<tr><td>${s.targetNickname}</td><td>${s.voteCount}</td><td>${s.requiredVotes}</td><td>${s.initiatorNickname||'-'}</td></tr>`).join('')}
        </table>`;
    }

    async function saveBanVote() {
      await api('PUT', '/api/ban-vote-settings', {
        enabled: document.getElementById('bEn').checked,
        requiredVotes: +document.getElementById('bVotes').value,
        windowSeconds: +document.getElementById('bWindow').value,
        banDurationSeconds: +document.getElementById('bBan').value
      });
      alert('已保存');
    }

    async function renderBlacklist() {
      const items = await api('GET', '/api/blacklist');
      document.getElementById('main').innerHTML = `<h2>歌曲黑名单</h2>
        <input id="blSong" placeholder="歌曲名"><input id="blReason" placeholder="原因">
        <button onclick="api('POST','/api/blacklist',{songName:document.getElementById('blSong').value,reason:document.getElementById('blReason').value}).then(renderBlacklist)">添加</button>
        <table><tr><th>歌曲</th><th>原因</th><th></th></tr>
        ${items.map(i => `<tr><td>${i.songName}</td><td>${i.reason}</td>
        <td><button class="sm" onclick="api('DELETE','/api/blacklist/${i.id}').then(renderBlacklist)">删除</button></td></tr>`).join('')}
        </table>`;
    }

    async function renderCleanup() {
      const c = await api('GET', '/api/cleanup');
      document.getElementById('main').innerHTML = `<h2>数据清理</h2>
        <label><input type="checkbox" id="cEn" ${c.enabled?'checked':''}> 启用定时清理</label>
        <input id="cInterval" type="number" placeholder="间隔(小时)" value="${c.intervalHours||24}">
        <input id="cQueue" type="number" placeholder="队列保留(天)" value="${c.queueRetentionDays||7}">
        <input id="cGift" type="number" placeholder="礼物保留(天)" value="${c.giftRetentionDays||30}">
        <button onclick="saveCleanup()">保存</button>`;
    }

    async function saveCleanup() {
      await api('PUT', '/api/cleanup', {
        enabled: document.getElementById('cEn').checked,
        intervalHours: +document.getElementById('cInterval').value,
        queueRetentionDays: +document.getElementById('cQueue').value,
        giftRetentionDays: +document.getElementById('cGift').value
      });
      alert('已保存');
    }

    if (token) {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');
      renderNav();
      showModule('dashboard');
      refreshEmergencyState();
      startAppTimers();
    } else {
      startRuntimeTimerOnly();
      refreshRuntimeStatus();
    }
  </script>
</body>
</html>
